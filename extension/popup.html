<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: #fafafa;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 4px 0;
      word-break: break-all;
    }
    .verdict-banner {
      padding: 10px 12px;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 14px;
      margin: 10px 0;
    }
    .safe { background: #2E7D32; }
    .suspicious { background: #F9A825; }
    .phishing { background: #D32F2F; }
    .unknown { background: #888888; }

    .score {
      font-size: 28px;
      font-weight: 700;
      margin: 4px 0;
    }
    .section {
      margin-top: 12px;
      font-size: 13px;
      color: #333;
    }
    .section-title {
      font-weight: 600;
      margin-bottom: 4px;
    }
    ul {
      margin: 4px 0;
      padding-left: 18px;
    }
    li {
      margin-bottom: 3px;
    }
    .brand-match {
      font-size: 13px;
      color: #555;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h2 id="domain">Checking current site...</h2>
  <div id="banner" class="verdict-banner unknown">Checking...</div>
  <div id="score" class="score"></div>

  <div class="section" id="prefilter-section" style="display:none;">
    <div class="section-title">Domain analysis</div>
    <ul id="prefilter-reasons"></ul>
  </div>

  <div class="section" id="visual-section" style="display:none;">
    <div class="section-title">Visual similarity</div>
    <div id="visual-details"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
