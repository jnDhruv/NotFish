<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NotFish</title>
<style>
  /* ---------------------------------------------------------------------
     Token system
     Light: cool paper + deep navy ink, muted signal colors (no neon).
     Dark:  near-black instrument panel, same signal hues lifted for contrast.
     Type:  system monospace for data readouts (domain, scores),
            system sans for UI chrome/labels. No remote font loads —
            keeps this CSP-safe inside the extension popup.
  --------------------------------------------------------------------- */
  :root {
    --bg: #F3F5F8;
    --surface: #FFFFFF;
    --surface-alt: #EBEEF3;
    --ink: #10151C;
    --ink-muted: #5B6572;
    --border: #DDE2E9;
    --safe: #157F5C;
    --safe-bg: #E7F5EF;
    --warn: #A8720F;
    --warn-bg: #FBF0DC;
    --danger: #B0332F;
    --danger-bg: #FBE8E7;
    --unknown: #6B7686;
    --unknown-bg: #EBEEF3;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Consolas, "Liberation Mono", monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  html[data-theme="dark"] {
    --bg: #0B0F14;
    --surface: #131922;
    --surface-alt: #1A212B;
    --ink: #E8ECF1;
    --ink-muted: #8B96A5;
    --border: #262E3A;
    --safe: #3FCB93;
    --safe-bg: #10241C;
    --warn: #E3AC4C;
    --warn-bg: #2A2214;
    --danger: #E36F6A;
    --danger-bg: #2A1615;
    --unknown: #8B96A5;
    --unknown-bg: #1A212B;
  }

  * { box-sizing: border-box; }

  body {
    width: 328px;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  /* ---------------- Header ---------------- */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .brand-mark {
    width: 20px;
    height: 20px;
    color: var(--ink);
    flex-shrink: 0;
  }

  .brand-name {
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink);
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-muted);
    cursor: pointer;
    padding: 0;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--ink-muted); }
  .theme-toggle:focus-visible { outline: 2px solid var(--ink-muted); outline-offset: 2px; }
  .theme-toggle svg { width: 15px; height: 15px; }

  /* ---------------- Target row ---------------- */
  .target {
    padding: 14px 16px 0 16px;
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.14em;
    color: var(--ink-muted);
    margin: 0 0 4px 0;
  }

  .domain {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin: 0;
  }

  /* ---------------- Verdict block ---------------- */
  .verdict-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 16px 4px 16px;
  }

  .gauge-wrap {
    position: relative;
    width: 108px;
    height: 108px;
  }

  .gauge-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }

  .gauge-track { fill: none; stroke: var(--border); stroke-width: 7; }
  .gauge-progress {
    fill: none;
    stroke-width: 7;
    stroke-linecap: round;
    transition: stroke-dasharray 0.6s ease, stroke 0.3s ease;
  }

  .gauge-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .gauge-score {
    font-family: var(--font-mono);
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    color: var(--ink);
  }
  .gauge-max {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-muted);
    margin-top: 2px;
    letter-spacing: 0.06em;
  }

  .pill {
    margin-top: 12px;
    padding: 5px 12px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .pill.safe { background: var(--safe-bg); color: var(--safe); }
  .pill.suspicious { background: var(--warn-bg); color: var(--warn); }
  .pill.phishing { background: var(--danger-bg); color: var(--danger); }
  .pill.unknown { background: var(--unknown-bg); color: var(--unknown); }

  .verdict-copy {
    margin: 8px 0 0 0;
    font-size: 12px;
    line-height: 1.5;
    color: var(--ink-muted);
    text-align: center;
    max-width: 260px;
  }

  /* ---------------- Sections ---------------- */
  .section {
    margin: 16px 16px 0 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .section:last-child { padding-bottom: 16px; }

  .section-title {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--ink-muted);
    margin: 0 0 8px 0;
  }

  .reason-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .reason-list li {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 12.5px;
    color: var(--ink);
    line-height: 1.4;
  }
  .reason-list li::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--ink-muted);
    flex-shrink: 0;
    margin-top: 5px;
  }

  .brand-match {
    margin-top: 8px;
    font-size: 12.5px;
    color: var(--ink-muted);
  }
  .brand-match strong { color: var(--ink); font-weight: 600; }

  .visual-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface-alt);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .visual-figure {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--ink);
    flex-shrink: 0;
  }
  .visual-caption {
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.4;
  }
  .visual-caption strong { color: var(--ink); font-weight: 600; }

  /* ---------------- Empty state ---------------- */
  .empty-state {
    margin: 16px;
    padding: 20px 16px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }
  .empty-state p {
    margin: 0;
    font-size: 12.5px;
    color: var(--ink-muted);
    line-height: 1.5;
  }

  .pulse {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--unknown);
    margin-right: 6px;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.5L20 6V11C20 16.2 16.6 20.4 12 21.5C7.4 20.4 4 16.2 4 11V6L12 2.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M9 11.5L11.2 13.7L15.5 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-name">NotFish</span>
    </div>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch theme" title="Switch theme"></button>
  </div>

  <div class="target">
    <p class="eyebrow">TARGET</p>
    <h2 class="domain" id="domain" title="">Checking current site…</h2>
  </div>

  <div id="result-view">
    <div class="verdict-block">
      <div class="gauge-wrap">
        <svg viewBox="0 0 100 100">
          <circle class="gauge-track" cx="50" cy="50" r="42"></circle>
          <circle class="gauge-progress" id="gauge-progress" cx="50" cy="50" r="42"
                  stroke-dasharray="0 263.9" stroke="var(--unknown)"></circle>
        </svg>
        <div class="gauge-center">
          <div class="gauge-score" id="gauge-score">—</div>
          <div class="gauge-max">/ 100</div>
        </div>
      </div>
      <div class="pill unknown" id="pill">Checking…</div>
      <p class="verdict-copy" id="verdict-copy"></p>
    </div>

    <div class="section hidden" id="visual-section">
      <p class="section-title">VISUAL SIMILARITY</p>
      <div class="visual-row">
        <div class="visual-figure" id="visual-figure"></div>
        <div class="visual-caption" id="visual-caption"></div>
      </div>
    </div>
  </div>

  <div class="empty-state hidden" id="empty-state">
    <p><span class="pulse"></span>No data yet — reload the page to run a check.</p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
